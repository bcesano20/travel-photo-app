# Railway's default build (Nixpacks) doesn't include ffmpeg, which the
# Celery worker needs for video thumbnails/duration extraction. This adds
# it as a system package during the build's setup phase.
#
# "..." keeps whatever Nixpacks would have installed by default and adds
# ffmpeg on top of it, instead of replacing the list entirely.

[phases.setup]
aptPkgs = ["...", "ffmpeg"]

# Compiles static files (Django admin's CSS/JS) into STATIC_ROOT so
# whitenoise has something to serve once DEBUG=False. Needs SECRET_KEY
# and the rest of the env vars available at build time — Railway provides
# the service's variables during the build, so this works without changes.
[phases.build]
cmds = ["python manage.py collectstatic --noinput"]